services:
  freetar:
    image: kmille2/freetar:latest
    build: .
    container_name: freetar
    ports:
      - "${FREETAR_PORT:-22000}:22000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    read_only: true

  # https://<FREETAR_HOSTNAME or FREETAR_LAN_IP>:8443 - needed for microphone access from phones/tablets
  # Run scripts/phone-url.sh to fill both in for the current network.
  caddy:
    image: caddy:2-alpine
    container_name: freetar-https
    depends_on:
      - freetar
    ports:
      - "${FREETAR_HTTPS_PORT:-8443}:8443"
    environment:
      - FREETAR_LAN_IP=${FREETAR_LAN_IP:-127.0.0.1}
      - FREETAR_HOSTNAME=${FREETAR_HOSTNAME:-freetar.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
