<!doctype html>
<html data-bs-theme="light" lang="en">

{% import 'macros.j2' as macros %}



<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="freetar is an open source alternative frontend to ultimate-guitar.com. Search for your chords/tabs hosted on Ultimate Guitar. View them in a simple design. You can save them for later in your favorites without having an account." />
  <meta name="keywords" content="freetar guitar chords tabs ultimate-guitar" />
  {{ macros.nodinex_on_favs() }}

  <meta property="og:title" content=freetar - guitar chords from Ultimate Guitar>
  <meta property="og:site_name" content=freetar>
  <meta property="og:url" content=https://freetar.de>
  <meta property="og:description" content=freetar is an alternative frontend for ultimate-guitar.com>
  <meta property="og:type" content=website>
  <meta property="og:image" content=https://freetar.de/static/guitar.png>


  <link href="/static/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/static/custom.css" rel="stylesheet">
  <link href="/static/audio.css" rel="stylesheet">
  <title>{{ title or "Freetar - guitar chords from Ultimate Guitar" }}</title>
  <link rel="icon" type="image/png" href="/static/guitar.png" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Freetar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)">
  <script>
    let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (JSON.parse(localStorage.getItem("dark_mode")) || isDarkMode)
      document.documentElement.setAttribute('data-bs-theme', 'dark')
    if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches)
      document.documentElement.classList.add('standalone')
  </script>
</head>

<body>

  <nav class="mb-2 navbar navbar-expand-lg bg-body-tertiary d-print-none">
    <div class="container d-flex" style="flex-wrap: nowrap;">
      <button type="button" id="app_back" class="btn btn-link nav-link app-only px-1 me-1" aria-label="Back" title="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg>
      </button>
      <a class="navbar-brand" href="/">Freetar</a>
      <form class="flex-grow-1 mx-2 mx-md-4" style="max-width: 36rem;" method="GET" action="/search" role="search">
        <div class="input-group">
          <input required class="form-control" name="search_term" type="search" value="{{ search_term or '' }}" placeholder="Search song or artist" aria-label="Search song or artist">
          <button class="btn btn-primary" type="submit" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
          </button>
        </div>
      </form>
      <ul class="navbar-nav ms-2" style="flex-direction: row;">
        <li class="nav-item">
          <a class="nav-link" href="#" role="button" data-bs-toggle="modal" data-bs-target="#tunerModal" title="Guitar tuner">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 0 0-6.5 6.5.75.75 0 0 1-1.5 0 8 8 0 0 1 16 0 .75.75 0 0 1-1.5 0A6.5 6.5 0 0 0 8 1.5"/><path d="M8.53 9.53a.75.75 0 0 1-1.06-1.06l3-3a.75.75 0 1 1 1.06 1.06z"/><circle cx="8" cy="9" r="1.5"/><path d="M3 13.25a.75.75 0 0 1 .75-.75h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1-.75-.75"/></svg>
            <span class="d-none d-md-inline">Tuner</span>
          </a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link" href="/about">
            <span class="d-none d-md-inline">About</span>
          </a>
        </li>
        <li class="nav-item ms-4">
          <a class="nav-link">
            <span role="button" title="enable/disable dark mode" id="dark_mode">
              🌓︎
            </span></a>
        </li>
      </ul>
    </div>
  </nav>


  <div class="container">
      <div class="row">
          {% block content %}
          {% endblock %}
      </div>
  </div>

  <div class="modal fade d-print-none" id="tunerModal" tabindex="-1" aria-labelledby="tunerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h1 class="modal-title fs-5" id="tunerModalLabel">Guitar tuner</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body"><div class="tuner-modal-body"></div></div>
      </div>
    </div>
  </div>

  <script src="/static/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/custom.js"></script>
  <script type="module" src="/static/tuner.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
